<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap">
<style id="site-css">
:root{--bg:#f6edd3;--cd:#fffaf0;--tx:#3a1c0d;--mu:#7b5d48;--ac:#e9a23b;--on:#2b1409;--ln:#d9c8a0;--hd:#3a1c0d;--hx:#f6edd3;--er:#b3261e;--sh:#0006;color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1410;--cd:#2a1d15;--tx:#f6edd3;--mu:#b9a58c;--ac:#f0a83f;--ln:#4a3828;--hd:#120c09;--er:#ff9a8a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c1410;--cd:#2a1d15;--tx:#f6edd3;--mu:#b9a58c;--ac:#f0a83f;--ln:#4a3828;--hd:#120c09;--er:#ff9a8a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--ln) 1.2px,transparent 1.4px);background-size:20px 20px;color:var(--tx);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
h1,h2{font-family:'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif;font-weight:400;margin:0;text-wrap:balance}

/* Header */
header{position:relative;overflow:hidden;isolation:isolate;text-align:center;color:var(--hx);padding:42px 16px 28px;background:radial-gradient(ellipse at 50% 20%,#5a2d15,var(--hd) 70%)}
.rays{position:absolute;left:50%;top:100px;width:1300px;height:1300px;margin:-650px 0 0 -650px;z-index:-1;background:repeating-conic-gradient(#e9a23b2e 0 6deg,transparent 0 12deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 62%);mask:radial-gradient(circle,#000 15%,transparent 62%);animation:spin 100s linear infinite}
.logo{display:block;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 5px var(--ac),0 0 0 9px var(--hd),0 0 0 11px var(--ac),0 14px 40px #e9a23b59;animation:pop 1s cubic-bezier(.2,1.3,.4,1) both}
header h1{font-size:clamp(34px,10vw,56px);line-height:1.1;text-shadow:3px 3px 0 #b3661a;animation:rise .6s .15s both}
.tag{margin:8px 0 0;opacity:.92;animation:rise .6s .25s both}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 0;animation:rise .6s .3s both}
.pills span{border:2px solid var(--ac);border-radius:99px;padding:4px 14px;font-size:14px}
.ph{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:18px;animation:rise .6s .38s both}
.tel{display:inline-flex;align-items:center;gap:10px;background:var(--ac);color:var(--on);border-radius:99px;padding:12px 26px;font-weight:700;font-size:clamp(24px,6.6vw,30px);line-height:1.1;text-decoration:none;white-space:nowrap;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
.cp{background:none;border:2px solid var(--ac);color:var(--hx);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}
.notice{background:var(--tx);color:var(--bg);text-align:center;font-weight:700;padding:10px 16px}
.mq{background:var(--ac);color:var(--on);border-block:3px solid var(--hd);overflow:hidden;white-space:nowrap;font:18px/1 'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif;padding:10px 0}
.mq div{display:inline-flex;animation:mq 40s linear infinite}

/* Category bar */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:2px solid var(--tx);box-shadow:0 6px 14px -10px #000}
nav button{flex:none;border:2px solid var(--tx);background:none;color:var(--tx);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
nav button.on{background:var(--tx);color:var(--bg)}

/* Menu */
main{max-width:1020px;margin:0 auto;padding:0 16px}
section{scroll-margin-top:64px;padding-top:26px}
h2{position:relative;font-size:30px;padding-bottom:8px}
h2::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tx);transform-origin:left}
.ic{display:inline-block;margin-right:8px}
.note{color:var(--mu);font-size:14px;margin:6px 0 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:16px 22px;margin-top:16px}
article{background:var(--cd);border:2px solid var(--tx);border-radius:14px;padding:14px 16px;box-shadow:4px 4px 0 var(--ac);transition:translate .18s,box-shadow .18s}
article:hover{translate:-2px -2px;box-shadow:6px 6px 0 var(--ac)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
article h3{margin:0;font-size:18px;overflow-wrap:anywhere}
article p{margin:2px 0 8px;font-size:13px;color:var(--mu)}
.pr{display:flex;flex-wrap:wrap;gap:8px}
.pt{min-width:92px;border:2px solid var(--tx);border-radius:8px;padding:5px 12px;font-weight:700;text-align:center;background:var(--bg);font-variant-numeric:tabular-nums}
.pt small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.bd{font-style:normal;font-size:12px;font-weight:700;background:var(--tx);color:var(--bg);border-radius:6px;padding:2px 8px}
article.off h3,article.off p,article.off .pr{opacity:.5}
article.off .pt{text-decoration:line-through}

/* Footer and call bar */
footer{margin-top:56px;background:var(--hd);color:var(--hx);text-align:center;font-size:14px;line-height:1.8;padding:46px 16px 110px}
footer b{font:22px 'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif}
footer a{color:var(--ac)}
footer .ft-tel{display:inline-block;font-size:24px;font-weight:700;line-height:1.3;text-decoration:none;margin:6px 0;-webkit-user-select:text;user-select:text}
.callbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));z-index:6;display:flex;gap:8px;animation:up .5s .4s cubic-bezier(.2,1.2,.3,1) both}
.cb-call{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:linear-gradient(var(--ac),#d98a22);color:var(--on);border:2px solid var(--tx);border-radius:14px;padding:10px 16px;text-decoration:none;box-shadow:0 10px 30px var(--sh)}
.cb-call>span{font-size:26px;line-height:1}
.cb-call small{display:block;font-size:13px;font-weight:600;line-height:1.2}
.cb-call b{display:block;font-size:22px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.cb-cp{flex:none;width:84px;background:var(--cd);color:var(--tx);border:2px solid var(--tx);border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 10px 30px var(--sh)}

/* Owner tools: shown only to people who can edit this page */
.adm-fab{position:fixed;left:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--tx);color:var(--bg);border:2px solid var(--tx);border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px var(--sh)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;background:var(--tx);color:var(--bg);font-weight:700;border-radius:10px;padding:10px 16px;z-index:60;animation:tin .25s both}
.adm{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.adm-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cd);border-bottom:2px solid var(--tx)}
.adm-top strong{flex:1;min-width:0;text-align:center;font:18px 'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif}
.b1,.b2,.sm{font-weight:700;border:2px solid var(--tx);border-radius:10px;cursor:pointer;color:var(--tx);background:none}
.b1{background:var(--ac);color:var(--on);padding:9px 14px}
.b2{padding:9px 12px}
.sm{font-size:13px;padding:6px 10px}
.b1:disabled,.sm:disabled{opacity:.4;cursor:default}
.sm[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.sm.dg{border-color:var(--er);color:var(--er)}
.wide{width:100%;padding:12px}
.adm-tabs{display:flex;gap:8px;padding:10px 14px 0}
.adm-body{flex:1;min-height:0;overflow:auto;padding:14px}
.adm-in{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cbar strong{flex:1;min-width:0;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:8px}
.row>*{min-width:0}
.row>.sm,.row>.b1,.row>.b2{flex:none;white-space:nowrap}
.grow{flex:1}
.ed,.cs{display:grid;gap:8px;background:var(--cd);border:2px solid var(--tx);border-radius:12px;padding:12px;margin-bottom:12px}
.ed.offx{border-style:dashed}
.ed input:not([type=checkbox]),.ed textarea,.cs input:not([type=checkbox]),.cs textarea{width:100%;min-width:0;font:inherit;padding:10px;border:2px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.ed input:focus,.ed textarea:focus,.cs input:focus,.cs textarea:focus{border-color:var(--tx);outline:0}
.fld{display:grid;gap:3px;min-width:0}
.fld.ico{flex:none;width:76px}
.fld.ico input{text-align:center}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.pg label,.fld label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.sw input{width:20px;height:20px}
.hint{margin:2px 0 0;font-size:13px;color:var(--mu)}
.adm-msg{min-height:46px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--tx);background:var(--cd);font-size:14px;font-weight:600}
.adm-msg.err{color:var(--er)}
.adm-msg.warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.adm-login{background:none;border:0;color:var(--ac);text-decoration:underline;font:inherit;font-size:13px;padding:14px 10px;cursor:pointer}
.pw{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#000a}
.pw-box{width:min(380px,100%);background:var(--cd);color:var(--tx);border:2px solid var(--tx);border-radius:16px;padding:18px;display:grid;gap:12px;box-shadow:0 10px 30px var(--sh)}
.pw-box h2{font-size:24px}
.pw-box input{width:100%;min-width:0;font:inherit;padding:10px;border:2px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.pw-box input:focus{border-color:var(--tx);outline:0}
.pw-err{margin:0;min-height:1.2em;color:var(--er);font-weight:700;font-size:14px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2) rotate(-160deg);opacity:0}}
@keyframes rise{from{transform:translateY(18px);opacity:0}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes up{from{transform:translateX(-50%) translateY(150%)}}
@keyframes tin{from{opacity:0}}
@keyframes rv{from{opacity:0;transform:translateY(22px)}}
@keyframes ul{from{transform:scaleX(0)}}
@keyframes wig{25%{transform:rotate(-14deg)}60%{transform:rotate(12deg)}}
@supports (animation-timeline:view()){
article{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
h2::after{animation:ul linear both;animation-timeline:view();animation-range:entry 20% entry 100%}
.ic{animation:wig linear both;animation-timeline:view();animation-range:entry 30% cover 35%}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script id="site-js">
(() => {
'use strict';
const FLAG = 'dzin-saved', STASH = 'dzin-draft', SC = 'script';
const HEAD = '<!doctype html>\n<html lang="sr">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Džin Tost Bar</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap">\n<style id="site-css">';
const MQ = 'Burgeri ✦ Pizze ✦ Paste ✦ Tostevi ✦ Palačinke ✦ ';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const txt = (v, d) => typeof v === 'string' ? v.trim() : d;
const num = v => { if (v == null || v === '') return null; const n = Math.round(Number(v)); return isFinite(n) && n >= 0 ? n : null; };
const safeJson = o => JSON.stringify(o).split('<').join('\\u003c').split(String.fromCharCode(0x2028)).join('\\u2028').split(String.fromCharCode(0x2029)).join('\\u2029');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const STATIC = !!document.getElementById('admin-key');

/* ---------- data ---------- */

function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  const i = d.info && typeof d.info === 'object' ? d.info : {};
  return {
    v: 1,
    logo: txt(d.logo, ''),
    info: { phone: txt(i.phone, '061 150 52 53'), address: txt(i.address, 'Ljube Nešića 26'), hours: txt(i.hours, '12:00–01:00'), notice: txt(i.notice, '') },
    cats: (Array.isArray(d.cats) ? d.cats : []).map((c, ci) => {
      c = c && typeof c === 'object' ? c : {};
      const sizes = (Array.isArray(c.sizes) ? c.sizes : []).map(s => txt(s, '')).filter(Boolean);
      const n = Math.max(1, sizes.length);
      return {
        id: txt(c.id, '') || 'k' + ci,
        name: txt(c.name, '') || 'Kategorija',
        icon: txt(c.icon, ''),
        note: txt(c.note, ''),
        sizes,
        items: (Array.isArray(c.items) ? c.items : []).map(it => {
          it = it && typeof it === 'object' ? it : {};
          const p = Array.isArray(it.prices) ? it.prices : [];
          return { name: txt(it.name, ''), desc: txt(it.desc, ''), off: it.off === true, prices: Array.from({ length: n }, (_, j) => num(p[j])) };
        })
      };
    })
  };
}

function telHref(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '381' + d.slice(1);
  return 'tel:+' + d;
}

/* The whole page is regenerated from its data, so a saved menu is a complete new version of the page. */
function buildDoc(data, css, js) {
  return HEAD + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n<' + SC + ' type="application/json" id="menu-data">' + safeJson(data) + '</' + SC + '>\n<' + SC + ' id="site-js">' + js + '</' + SC + '>\n</body>\n</html>\n';
}

/* ---------- public page ---------- */

function tags(c, it) {
  return it.prices.map((p, j) => p == null ? '' : `<span class="pt">${c.sizes[j] ? `<small>${esc(c.sizes[j])}</small>` : ''}${p} din</span>`).join('');
}

function card(c, it) {
  return `<article${it.off ? ' class="off"' : ''}><div class="hd"><h3>${esc(it.name)}</h3>${it.off ? '<em class="bd">Nema danas</em>' : ''}</div>${it.desc ? `<p>${esc(it.desc)}</p>` : ''}<div class="pr">${tags(c, it)}</div></article>`;
}

function renderSite(d) {
  const i = d.info, t = telHref(i.phone), ph = esc(i.phone);
  const vis = d.cats.filter(c => c.items.length);
  const call = t ? `<div class="ph"><a class="tel" href="${t}"><span aria-hidden="true">📞</span>${ph}</a><button class="cp" type="button" data-copy="${ph}">Kopiraj broj</button></div>` : '';
  const bar = t ? `<div class="callbar"><a class="cb-call" href="${t}"><span aria-hidden="true">📞</span><div><small>Pozovi i poruči</small><b>${ph}</b></div></a><button class="cb-cp" type="button" data-copy="${ph}">Kopiraj</button></div>` : '';
  const nav = vis.map((c, k) => `<button type="button" data-go="s${k}">${c.icon ? esc(c.icon) + ' ' : ''}${esc(c.name)}</button>`).join('');
  const secs = vis.map((c, k) => `<section id="s${k}"><h2>${c.icon ? `<span class="ic" aria-hidden="true">${esc(c.icon)}</span>` : ''}${esc(c.name)}</h2>${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}<div class="g">${c.items.map(it => card(c, it)).join('')}</div></section>`).join('');
  return `<header><i class="rays" aria-hidden="true"></i>${d.logo ? `<img class="logo" src="${esc(d.logo)}" alt="Džin Tost Bar" width="112" height="112">` : ''}<h1>Džin Tost Bar</h1><p class="tag">Tostevi, burgeri, pizze, paste i palačinke</p><p class="pills">${i.address ? `<span>📍 ${esc(i.address)}</span>` : ''}${i.hours ? `<span>🕛 Radno vreme ${esc(i.hours)}</span>` : ''}</p>${call}</header>`
    + (i.notice ? `<div class="notice" role="note">${esc(i.notice)}</div>` : '')
    + `<div class="mq" aria-hidden="true"><div>${('<span>' + MQ.repeat(4) + '</span>').repeat(2)}</div></div><nav aria-label="Kategorije">${nav}</nav><main>${secs}</main>`
    + `<footer><b>Džin Tost Bar</b><br>${esc(i.address)}<br>Radno vreme ${esc(i.hours)}<br>${t ? `<a class="ft-tel" href="${t}">${ph}</a><br>` : ''}<a href="https://www.instagram.com/dzin_tost_bar" target="_blank" rel="noopener">Instagram: dzin_tost_bar</a><br>Facebook: dzin tost bar 019${STATIC ? '<br><button class="adm-login" type="button" id="adm-login">Admin</button>' : ''}</footer>${bar}`;
}

async function copyNumber(btn) {
  const t = btn.dataset.copy;
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) { /* fall through */ }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    } catch (e) { /* fall through */ }
  }
  if (!ok) {
    const n = $('.tel');
    if (n) { const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
  const old = btn.dataset.l || btn.textContent;
  btn.dataset.l = old;
  btn.textContent = ok ? 'Kopirano ✓' : 'Broj je označen';
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; }, 2200);
}

/* Some page viewers block phone links and the page cannot tell whether a call opened.
   If the page is still in front a moment after the tap, say how to call by hand. */
function watchCall() {
  let gone = false;
  const mark = () => { gone = true; };
  const evs = [[window, 'blur'], [window, 'pagehide'], [document, 'visibilitychange']];
  evs.forEach(([o, n]) => o.addEventListener(n, mark));
  setTimeout(() => {
    evs.forEach(([o, n]) => o.removeEventListener(n, mark));
    if (!gone && !document.hidden) toast('Ako se poziv nije otvorio, pozovite ručno: ' + DATA.info.phone + '. Dugme „Kopiraj“ kopira broj.', 6500);
  }, 1100);
}

let SO = null;
function wirePublic() {
  const app = $('#app');
  if (!app.dataset.wired) {
    app.dataset.wired = '1';
    app.addEventListener('click', e => {
      if (e.target.closest('#adm-login')) { openLogin(); return; }
      const g = e.target.closest('[data-go]');
      if (g) { const el = document.getElementById(g.dataset.go); if (el) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); return; }
      const c = e.target.closest('[data-copy]');
      if (c) { copyNumber(c); return; }
      if (e.target.closest('a[href^="tel:"]')) watchCall();
    });
  }
  if (SO) { SO.disconnect(); SO = null; }
  const secs = [...document.querySelectorAll('main section')], btns = [...document.querySelectorAll('nav button')];
  if (!('IntersectionObserver' in window) || !secs.length) return;
  const nv = $('nav');
  SO = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const i = secs.indexOf(e.target);
    btns.forEach((b, j) => b.classList.toggle('on', i === j));
    nv.scrollTo({ left: btns[i].offsetLeft - 70, behavior: reduced() ? 'auto' : 'smooth' });
  }), { rootMargin: '-30% 0px -60% 0px' });
  secs.forEach(s => SO.observe(s));
}

/* ---------- owner tools (visible only to people who can edit this page) ---------- */

let DATA, app, ART = null, adm = null, draft = null, cur = 0, tab = 'items', catOpen = false, base = '', busy = false, msg = { t: '', k: '' }, stT = 0;

const snap = d => JSON.stringify(normalize(d));
const dirty = () => !!draft && snap(draft) !== base;
const sizeN = c => Math.max(1, c.sizes.filter(s => String(s).trim()).length);

function toast(t, ms) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms || 3500);
}

function stash() {
  if (STATIC) return;
  try { if (draft && dirty()) sessionStorage.setItem(STASH, JSON.stringify(draft)); else sessionStorage.removeItem(STASH); } catch (e) { /* storage may be unavailable */ }
}

function drawMsg() {
  const m = adm && adm.querySelector('#adm-msg');
  if (!m) return;
  if (msg.k === 'confirm') {
    m.className = 'adm-msg warn';
    m.innerHTML = '<span>Imate nesačuvane izmene.</span> <button class="sm dg" type="button" data-a="discard">Odbaci izmene</button> <button class="sm" type="button" data-a="keep">Nastavi uređivanje</button>';
    return;
  }
  const t = msg.t || (dirty() ? 'Nesačuvane izmene' : '');
  m.className = 'adm-msg' + (msg.t && msg.k === 'err' ? ' err' : '');
  m.textContent = t;
}

function touch() {
  const s = adm && adm.querySelector('[data-a="save"]');
  if (s) s.disabled = busy || !dirty();
  drawMsg();
  clearTimeout(stT);
  stT = setTimeout(stash, 400);
}

function catSettings(c) {
  return `<div class="cs"><div class="fld"><label for="c-name">Naziv kategorije</label><input id="c-name" data-f="c-name" value="${esc(c.name)}" maxlength="60"></div>`
    + `<div class="row"><div class="fld ico"><label for="c-icon">Ikona</label><input id="c-icon" data-f="c-icon" value="${esc(c.icon)}" maxlength="8"></div><div class="fld grow"><label for="c-note">Napomena ispod naslova (nije obavezna)</label><input id="c-note" data-f="c-note" value="${esc(c.note)}" maxlength="140"></div></div>`
    + `<div class="fld"><label for="c-sizes">Kolone cena (nije obavezno)</label><div class="row"><input id="c-sizes" data-f="c-sizes" value="${esc(c.sizes.join(', '))}" placeholder="Na primer: Mala, Velika" maxlength="80"><button class="sm" type="button" data-a="sizes">Primeni</button></div><p class="hint">Odvojite nazive zarezom. Ostavite prazno ako jela imaju jednu cenu.</p></div>`
    + `<div class="row"><button class="sm" type="button" data-a="cat-up"${cur === 0 ? ' disabled' : ''} aria-label="Pomeri kategoriju gore">↑ Gore</button><button class="sm" type="button" data-a="cat-down"${cur === draft.cats.length - 1 ? ' disabled' : ''} aria-label="Pomeri kategoriju dole">↓ Dole</button><span class="grow"></span><button class="sm dg" type="button" data-a="cat-del">Obriši kategoriju</button></div></div>`;
}

function itemEd(c, it, i, n) {
  const pr = Array.from({ length: n }, (_, j) => `<label for="p-${i}-${j}">${esc(c.sizes[j] || 'Cena (din)')}<input id="p-${i}-${j}" type="number" inputmode="numeric" min="0" step="1" data-f="price" data-i="${i}" data-j="${j}" value="${it.prices[j] == null ? '' : it.prices[j]}"></label>`).join('');
  return `<div class="ed${it.off ? ' offx' : ''}">`
    + `<div class="row"><input class="nm" id="nm-${i}" data-f="name" data-i="${i}" value="${esc(it.name)}" placeholder="Naziv jela" aria-label="Naziv jela" maxlength="80"><button class="sm" type="button" data-a="up" data-i="${i}" aria-label="Pomeri gore"${i === 0 ? ' disabled' : ''}>↑</button><button class="sm" type="button" data-a="down" data-i="${i}" aria-label="Pomeri dole"${i === c.items.length - 1 ? ' disabled' : ''}>↓</button></div>`
    + `<textarea id="ds-${i}" rows="2" data-f="desc" data-i="${i}" placeholder="Sastojci" aria-label="Sastojci" maxlength="300">${esc(it.desc)}</textarea>`
    + `<div class="pg">${pr}</div>`
    + `<div class="row"><label class="sw"><input type="checkbox" data-f="off" data-i="${i}"${it.off ? ' checked' : ''}> Nema danas</label><span class="grow"></span><button class="sm dg" type="button" data-a="del" data-i="${i}">Obriši</button></div></div>`;
}

function itemsHtml(d, c) {
  const chips = d.cats.map((k, i) => `<button class="sm" type="button" data-a="cat" data-i="${i}" aria-pressed="${i === cur}">${k.icon ? esc(k.icon) + ' ' : ''}${esc(k.name || 'Kategorija')}</button>`).join('') + '<button class="sm" type="button" data-a="cat-add">+ Nova kategorija</button>';
  if (!c) return `<div class="chips">${chips}</div><p class="hint">Meni nema kategorija. Dodajte prvu.</p>`;
  const n = sizeN(c);
  return `<div class="chips">${chips}</div>`
    + `<div class="cbar"><strong id="cat-title">${esc(c.name || 'Kategorija')}</strong><button class="sm" type="button" data-a="cat-set" aria-expanded="${catOpen}">⚙ Kategorija</button></div>`
    + (catOpen ? catSettings(c) : '')
    + c.items.map((it, i) => itemEd(c, it, i, n)).join('')
    + `<button class="b1 wide" id="add-btn" type="button" data-a="add">+ Dodaj jelo u „${esc(c.name || 'Kategorija')}“</button>`;
}

function infoHtml(d) {
  const i = d.info;
  return `<div class="cs"><div class="fld"><label for="i-phone">Telefon</label><input id="i-phone" type="tel" inputmode="tel" data-f="i-phone" value="${esc(i.phone)}" maxlength="30"><p class="hint">Prikazuje se na vrhu i pri dnu sajta. Poziv se otvara sa ovim brojem.</p></div>`
    + `<div class="fld"><label for="i-address">Adresa</label><input id="i-address" data-f="i-address" value="${esc(i.address)}" maxlength="80"></div>`
    + `<div class="fld"><label for="i-hours">Radno vreme</label><input id="i-hours" data-f="i-hours" value="${esc(i.hours)}" maxlength="40"><p class="hint">Na primer: 12:00–01:00</p></div>`
    + `<div class="fld"><label for="i-notice">Obaveštenje na vrhu sajta (nije obavezno)</label><textarea id="i-notice" rows="2" data-f="i-notice" maxlength="160">${esc(i.notice)}</textarea><p class="hint">Na primer: Danas radimo do 02:00. Ostavite prazno da se ne prikazuje.</p></div></div>`;
}

function renderAdmin(o) {
  o = o || {};
  const old = adm.querySelector('.adm-body'), st = old && !o.top ? old.scrollTop : 0;
  const c = draft.cats[cur];
  adm.innerHTML = '<div class="adm-top"><button class="b2" type="button" data-a="close">✕ Zatvori</button><strong>Uređivanje menija</strong><button class="b1" type="button" data-a="save" disabled>' + (STATIC ? 'Sačuvaj i preuzmi' : 'Sačuvaj i objavi') + '</button></div>'
    + `<div class="adm-tabs"><button class="sm" type="button" data-a="tab" data-v="items" aria-pressed="${tab === 'items'}">Jela i cene</button><button class="sm" type="button" data-a="tab" data-v="info" aria-pressed="${tab === 'info'}">Podaci o lokalu</button></div>`
    + `<div class="adm-body"><div class="adm-in">${tab === 'info' ? infoHtml(draft) : itemsHtml(draft, c)}</div></div><div class="adm-msg" id="adm-msg" role="status" aria-live="polite"></div>`;
  const nb = adm.querySelector('.adm-body');
  if (nb) nb.scrollTop = st;
  touch();
  if (o.focus) { const el = adm.querySelector(o.focus); if (el) el.focus(); }
}

function openAdmin(restore, note) {
  draft = restore ? normalize(restore) : clone(DATA);
  base = snap(DATA);
  cur = 0; tab = 'items'; catOpen = false; busy = false;
  msg = note ? { t: note, k: 'info' } : { t: '', k: '' };
  adm.hidden = false; app.inert = true;
  document.documentElement.style.overflow = 'hidden';
  renderAdmin({ top: true, focus: '[data-a="close"]' });
}

function hide() {
  adm.hidden = true; adm.innerHTML = ''; app.inert = false;
  document.documentElement.style.overflow = '';
  draft = null; clearTimeout(stT);
  try { sessionStorage.removeItem(STASH); } catch (e) { /* storage may be unavailable */ }
}

function tryClose() {
  if (busy) return;
  if (dirty()) { msg = { t: '', k: 'confirm' }; drawMsg(); } else hide();
}

function syncCat() {
  const c = draft.cats[cur];
  if (!c) return;
  const ch = adm.querySelector(`[data-a="cat"][data-i="${cur}"]`);
  if (ch) ch.textContent = (c.icon ? c.icon + ' ' : '') + (c.name.trim() || 'Kategorija');
  const t = $('#cat-title'); if (t) t.textContent = c.name.trim() || 'Kategorija';
  const a = $('#add-btn'); if (a) a.textContent = '+ Dodaj jelo u „' + (c.name.trim() || 'Kategorija') + '“';
}

function applySizes(rerender) {
  const el = $('#c-sizes'), c = draft && draft.cats[cur];
  if (!el || !c || tab !== 'items') return false;
  const v = el.value.split(',').map(s => s.trim()).filter(Boolean);
  if (v.join('|') === c.sizes.join('|')) return false;
  c.sizes = v;
  const n = Math.max(1, v.length);
  c.items.forEach(it => { while (it.prices.length < n) it.prices.push(null); });
  if (rerender) renderAdmin();
  return true;
}

function arm(b, next, label) {
  const a = b.dataset.a, t = b.textContent;
  b.dataset.a = next; b.textContent = label;
  clearTimeout(b._t);
  b._t = setTimeout(() => { b.dataset.a = a; b.textContent = t; }, 4000);
}

function onInput(e) {
  const t = e.target, f = t.dataset && t.dataset.f;
  if (!f || f === 'c-sizes') return;
  const c = draft.cats[cur], i = +t.dataset.i;
  switch (f) {
    case 'name': c.items[i].name = t.value; break;
    case 'desc': c.items[i].desc = t.value; break;
    case 'price': c.items[i].prices[+t.dataset.j] = t.value === '' ? null : Number(t.value); break;
    case 'off': c.items[i].off = t.checked; t.closest('.ed').classList.toggle('offx', t.checked); break;
    case 'c-name': c.name = t.value; syncCat(); break;
    case 'c-icon': c.icon = t.value; syncCat(); break;
    case 'c-note': c.note = t.value; break;
    case 'i-phone': draft.info.phone = t.value; break;
    case 'i-address': draft.info.address = t.value; break;
    case 'i-hours': draft.info.hours = t.value; break;
    case 'i-notice': draft.info.notice = t.value; break;
  }
  msg = { t: '', k: '' };
  touch();
}

function onClick(e) {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a, c = draft && draft.cats[cur], i = +b.dataset.i;
  switch (a) {
    case 'close': tryClose(); break;
    case 'save': save(); break;
    case 'discard': hide(); break;
    case 'keep': msg = { t: '', k: '' }; drawMsg(); break;
    case 'tab': tab = b.dataset.v; renderAdmin({ top: true }); break;
    case 'cat': cur = i; catOpen = false; renderAdmin({ top: true }); break;
    case 'cat-add':
      draft.cats.push({ id: 'k' + Date.now().toString(36), name: 'Nova kategorija', icon: '🍽️', note: '', sizes: [], items: [] });
      cur = draft.cats.length - 1; catOpen = true; tab = 'items';
      renderAdmin({ top: true, focus: '#c-name' });
      break;
    case 'cat-set': catOpen = !catOpen; renderAdmin(); break;
    case 'sizes': applySizes(true); break;
    case 'cat-up':
      if (cur > 0) { [draft.cats[cur - 1], draft.cats[cur]] = [draft.cats[cur], draft.cats[cur - 1]]; cur--; renderAdmin(); }
      break;
    case 'cat-down':
      if (cur < draft.cats.length - 1) { [draft.cats[cur + 1], draft.cats[cur]] = [draft.cats[cur], draft.cats[cur + 1]]; cur++; renderAdmin(); }
      break;
    case 'cat-del': arm(b, 'cat-del-ok', 'Potvrdi brisanje kategorije'); break;
    case 'cat-del-ok': draft.cats.splice(cur, 1); cur = Math.max(0, cur - 1); catOpen = false; renderAdmin({ top: true }); break;
    case 'add':
      c.items.push({ name: '', desc: '', off: false, prices: Array(sizeN(c)).fill(null) });
      renderAdmin({ focus: '#nm-' + (c.items.length - 1) });
      break;
    case 'up':
      if (i > 0) { [c.items[i - 1], c.items[i]] = [c.items[i], c.items[i - 1]]; renderAdmin({ focus: `[data-a="up"][data-i="${i - 1}"]` }); }
      break;
    case 'down':
      if (i < c.items.length - 1) { [c.items[i + 1], c.items[i]] = [c.items[i], c.items[i + 1]]; renderAdmin({ focus: `[data-a="down"][data-i="${i + 1}"]` }); }
      break;
    case 'del': arm(b, 'del-ok', 'Potvrdi brisanje'); break;
    case 'del-ok': c.items.splice(i, 1); renderAdmin(); break;
  }
}

function validate() {
  for (let k = 0; k < draft.cats.length; k++) {
    const c = draft.cats[k], n = sizeN(c);
    if (!c.name.trim()) return { k, open: true, focus: '#c-name', t: 'Upišite naziv kategorije.' };
    for (let i = 0; i < c.items.length; i++) {
      const it = c.items[i];
      if (!it.name.trim()) return { k, focus: '#nm-' + i, t: 'Upišite naziv jela u kategoriji „' + c.name.trim() + '“.' };
      if (!it.prices.slice(0, n).some(p => num(p) != null)) return { k, focus: '#p-' + i + '-0', t: 'Upišite cenu za „' + it.name.trim() + '“.' };
    }
  }
  if (!draft.info.phone.trim()) return { tab: 'info', focus: '#i-phone', t: 'Upišite broj telefona.' };
  return null;
}

async function save() {
  if (busy || (!ART && !STATIC)) return;
  applySizes(false);
  const p = validate();
  if (p) {
    if (p.k != null) cur = p.k;
    tab = p.tab || 'items'; catOpen = !!p.open;
    msg = { t: p.t, k: 'err' };
    renderAdmin({ top: true, focus: p.focus });
    return;
  }
  const css = ($('#site-css') || {}).textContent, js = ($('#site-js') || {}).textContent;
  if (!css || !js) { msg = { t: 'Čuvanje nije dostupno u ovom prikazu. Otvorite stranicu iz Claude-a.', k: 'err' }; drawMsg(); return; }
  if (STATIC) { saveStatic(); return; }
  stash();
  busy = true; msg = { t: 'Čuvam…', k: 'info' }; touch();
  try { sessionStorage.setItem(FLAG, '1'); } catch (e) { /* storage may be unavailable */ }
  try {
    await ART.publish(buildDoc(normalize(draft), css, js));
    msg = { t: 'Sačuvano. Učitava se nova verzija…', k: 'info' }; drawMsg();
  } catch (e) {
    busy = false;
    try { sessionStorage.removeItem(FLAG); } catch (_) { /* storage may be unavailable */ }
    const code = e && e.code;
    msg = {
      k: 'err',
      t: code === 'conflict' ? 'Meni je u međuvremenu izmenjen na drugom mestu. Stranica se učitava iznova, a vaše izmene će biti vraćene.'
        : ['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(code) ? 'Nemate dozvolu da menjate ovu stranicu.'
        : code === 'rate_limited' ? 'Previše pokušaja. Sačekajte minut i pokušajte ponovo.'
        : code === 'too_large' ? 'Meni je prevelik za čuvanje. Skratite opise jela.'
        : 'Čuvanje nije uspelo. Pokušajte ponovo.'
    };
    touch();
  }
}

/* Static copy (GitHub Pages): an admin password unlocks the editor. Saving downloads a new index.html to upload. */
const b64 = u => btoa(String.fromCharCode.apply(null, Array.from(u)));
const b64bytes = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
let fails = 0;

async function checkPassword(pw) {
  try {
    const k = JSON.parse($('#admin-key').textContent);
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw).trim()), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64bytes(k.s), iterations: k.i, hash: 'SHA-256' }, key, 256);
    return b64(new Uint8Array(bits)) === k.h;
  } catch (e) { return false; }
}

function closeLogin() { const b = document.getElementById('pw'); if (b) b.remove(); }

function openLogin() {
  if (document.getElementById('pw') || (adm && !adm.hidden)) return;
  const box = document.createElement('div');
  box.className = 'pw'; box.id = 'pw';
  box.innerHTML = '<form class="pw-box" id="pw-form" novalidate>'
    + '<h2>Admin prijava</h2>'
    + '<p class="hint">Unesite admin lozinku da biste uredili meni.</p>'
    + '<div class="fld"><label for="pw-in">Lozinka</label><input id="pw-in" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="80"></div>'
    + '<p class="pw-err" id="pw-msg" role="status" aria-live="polite"></p>'
    + '<div class="row"><button class="b2" type="button" data-pw="cancel">Odustani</button><span class="grow"></span><button class="b1" type="submit">Otključaj</button></div>'
    + '</form>';
  document.body.appendChild(box);
  const inp = box.querySelector('#pw-in'), msgEl = box.querySelector('#pw-msg'), go = box.querySelector('.b1');
  box.addEventListener('keydown', e => { if (e.key === 'Escape') closeLogin(); });
  box.addEventListener('click', e => { if (e.target === box || e.target.closest('[data-pw="cancel"]')) closeLogin(); });
  box.querySelector('#pw-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!(window.crypto && crypto.subtle)) { msgEl.textContent = 'Prijava nije dostupna na ovoj adresi. Otvorite sajt preko https.'; return; }
    go.disabled = true; msgEl.textContent = 'Proveravam…';
    const ok = await checkPassword(inp.value);
    if (ok) { fails = 0; closeLogin(); ownerUi(); openAdmin(); return; }
    fails++;
    msgEl.textContent = 'Lozinka nije tačna.';
    inp.select();
    await new Promise(r => setTimeout(r, Math.min(5000, fails * 800)));
    go.disabled = false;
  });
  inp.focus();
}

function ownerUi() {
  if (adm) return;
  adm = document.createElement('div');
  adm.className = 'adm'; adm.id = 'adm'; adm.hidden = true;
  adm.setAttribute('role', 'dialog'); adm.setAttribute('aria-modal', 'true'); adm.setAttribute('aria-label', 'Uređivanje menija');
  const fab = document.createElement('button');
  fab.type = 'button'; fab.className = 'adm-fab'; fab.id = 'adm-open'; fab.textContent = '✏️ Uredi meni';
  document.body.append(adm, fab);
  fab.addEventListener('click', () => openAdmin());
  adm.addEventListener('click', onClick);
  adm.addEventListener('input', onInput);
  adm.addEventListener('change', onInput);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !adm.hidden) tryClose(); });
}

function saveStatic() {
  const next = normalize(draft);
  const doc = '<!doctype html>\n<html lang="sr">\n' + document.head.outerHTML + '\n<body>\n<div id="app"></div>\n<' + SC + ' type="application/json" id="menu-data">' + safeJson(next) + '</' + SC + '>\n<' + SC + ' id="site-js">' + $('#site-js').textContent + '</' + SC + '>\n</body>\n</html>\n';
  const url = URL.createObjectURL(new Blob([doc], { type: 'text/html;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  DATA = next; base = snap(next);
  app.innerHTML = renderSite(DATA);
  wirePublic();
  busy = false;
  msg = { t: 'Preuzet je fajl index.html. Otpremite ga na GitHub da bi se sajt promenio.', k: 'info' };
  touch();
}

async function initOwner() {
  if (STATIC) return;
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const u = await window.claude.use('user');
    if (!u || !(await u.canEdit())) return;
    const a = await window.claude.use('artifact');
    if (!a || typeof a.publish !== 'function') return;
    ART = a;
    ownerUi();
    let saved = null, kept = null;
    try { saved = sessionStorage.getItem(FLAG); kept = sessionStorage.getItem(STASH); sessionStorage.removeItem(FLAG); } catch (e) { /* storage may be unavailable */ }
    if (saved) { try { sessionStorage.removeItem(STASH); } catch (e) { /* storage may be unavailable */ } toast('Izmene su objavljene ✓'); }
    else if (kept) { try { openAdmin(JSON.parse(kept), 'Vraćene su vaše nesačuvane izmene. Proverite ih i sačuvajte.'); } catch (e) { /* ignore a broken draft */ } }
  } catch (e) { /* the public page works without owner tools */ }
}

/* ---------- start ---------- */

let raw = null;
try { raw = JSON.parse($('#menu-data').textContent); } catch (e) { /* fall back to defaults */ }
DATA = normalize(raw);
app = $('#app');
app.innerHTML = renderSite(DATA);
wirePublic();
initOwner();
})();
</script>
